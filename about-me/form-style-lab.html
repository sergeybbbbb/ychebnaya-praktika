<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заявка на учебный интенсив</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <nav class="main-nav" aria-label="Главное меню">
      <ul>
        //навигация
      </ul>
    </nav>
  </header>

  <main class="page-container">
    <h1>Заявка на учебный интенсив</h1>
    <p id="form-help">Поля со звёздочкой обязательны.</p>

    <form class="study-form" action="#" method="post" aria-describedby="form-help">
      <div class="form-grid">
        <div class="form-field">
          <label for="student-name">Имя и фамилия *</label>
          <input id="student-name" name="student-name" type="text" required autocomplete="name">
        </div>

        <div class="form-field">
          <label for="student-email">Электронная почта *</label>
          <input id="student-email" name="student-email" type="email" required autocomplete="email">
          <small>Пример: student@example.ru</small>
        </div>

        <div class="form-field form-field--wide">
          <label for="course">Направление *</label>
          <select id="course" name="course" required>
            <option value="">Выберите направление</option>
            <option value="html">HTML и CSS</option>
            <option value="git">Git и GitHub</option>
            <option value="project">Учебный проект</option>
          </select>
        </div>

        <fieldset class="form-field form-field--wide">
          <legend>Формат участия</legend>
          <label class="choice"><input type="radio" name="format" value="class" checked> В аудитории</label>
          <label class="choice"><input type="radio" name="format" value="online"> Онлайн</label>
        </fieldset>

        <div class="form-field form-field--wide">
          <label for="comment">Комментарий</label>
          <textarea id="comment" name="comment" rows="5" maxlength="500"></textarea>
        </div>
      </div>

      <label class="choice agreement">
        <input type="checkbox" name="agreement" required>
        Я проверил введённые данные *
      </label>

      <div class="form-actions">
        <button type="submit">Отправить заявку</button>
        <button type="reset" class="button-secondary">Очистить</button>
      </div>
    </form>
  </main>

  <footer class="page-footer"><p>Учебная практика УП.09</p></footer>
</body>
</html>
